# Deploy with:  npx wrangler login  &&  npx wrangler deploy
#
# A Worker of its own rather than websoccer's, on purpose. The board lives in a
# single Durable Object under one key, so one Worker serving both games would
# mean one table with football and tennis results mixed into it. Two Workers,
# two boards - and they can still post into the same Discord channel, because
# that is only a webhook address.

name = "webtennis"
main = "index.js"
compatibility_date = "2025-04-01"

[[durable_objects.bindings]]
name = "ARENA"
class_name = "Arena"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Arena"]
